services:
  windows-xp:
    build: .
    container_name: railway-windows-xp
    environment:
      VERSION: "xp"
      USERNAME: "root"
      PASSWORD: "root"
      RAM_SIZE: "auto"
      CPU_CORES: "2"
      DISK_SIZE: "16G"
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
      - "3389:3389/udp"
    volumes:
      - ./windows-xp-data:/storage
    restart: unless-stopped
    stop_grace_period: 2m
